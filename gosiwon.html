<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="친구하자드 — 집 안.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2734%27%20r%3D%2727%27%20fill%3D%27%23ffdcc6%27%20stroke%3D%27%231f1a24%27%20stroke-width%3D%273%27/%3E%3Cpath%20d%3D%27M6%2030C6%2012%2020%205%2033%205s26%208%2025%2025c-6-9-16-12-27-12S12%2021%206%2030z%27%20fill%3D%27%231c1519%27/%3E%3Cellipse%20cx%3D%2722%27%20cy%3D%2735%27%20rx%3D%277%27%20ry%3D%278.5%27%20fill%3D%27%233a1f12%27/%3E%3Cellipse%20cx%3D%2742%27%20cy%3D%2735%27%20rx%3D%277%27%20ry%3D%278.5%27%20fill%3D%27%233a1f12%27/%3E%3Ccircle%20cx%3D%2719.5%27%20cy%3D%2731.5%27%20r%3D%273%27%20fill%3D%27%23fff%27/%3E%3Ccircle%20cx%3D%2739.5%27%20cy%3D%2731.5%27%20r%3D%273%27%20fill%3D%27%23fff%27/%3E%3Cpath%20d%3D%27M26%2047q6%205%2012%200%27%20fill%3D%27none%27%20stroke%3D%27%238c3a3a%27%20stroke-width%3D%272.6%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E">
<title>친구하자드 — 집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root {
  --paper: #ffffff;
  --ink: #1f1a24;
  --ink-2: #6a6272;
  --blood: #d3122c;
  --gold: #f6c42f;
  --knife: #d3122c;
  --font-display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); }
body { font-family: var(--font-sans); word-break: keep-all; overflow-wrap: anywhere; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui button { pointer-events: auto; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#ui button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.gold {
  font-family: var(--font-display); font-weight: 400; line-height: 1; letter-spacing: -0.01em;
  color: #f0141d;
  text-shadow: .012em .015em 0 #08070a, .024em .03em 0 #08070a,
    .036em .045em 0 #08070a, .048em .06em 0 #08070a,
    .06em .075em 0 #08070a, .072em .09em 0 #08070a;
  white-space: nowrap;
}
.inkbtn { position: relative; pointer-events: auto; font-family: var(--font-display); font-size: 24px; letter-spacing: 0.4em; padding: 17px 30px 16px 40px; background: var(--ink); color: #fff !important; border: 0; border-radius: 3px; box-shadow: 0 5px 0 #000; transition: transform .08s, box-shadow .08s; }
.inkbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
.inkbtn[disabled] { opacity: .35; cursor: default; }

/* 시작 화면 */
#title { position: absolute; inset: 0; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: min(26px, 3.4vh); padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b)); pointer-events: auto; }
#title .logo { font-size: clamp(48px, min(17vw, 15vh), 150px); margin: 0 0 .1em; }
#title .keys, #gate .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; max-width: 560px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
#title .keys span, #gate .keys span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#title kbd, #gate kbd { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border: 2px solid var(--ink); border-radius: 5px; box-shadow: 0 2px 0 var(--ink); font: 900 12px/1 var(--font-sans); color: var(--ink); background: #fff; }
#title .touchkeys, #gate .touchkeys { display: none; }
body.touch #title .deskkeys, body.touch #gate .deskkeys { display: none; }
body.touch #title .touchkeys, body.touch #gate .touchkeys { display: flex; }
/* 밖에서 들어왔을 때: 현관 앞 */
#gate { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 16px 16px calc(6vh + 12px + var(--safe-b)); pointer-events: auto; }
#gate.ready { cursor: pointer; }
#gate .gbox { display: grid; gap: 14px; justify-items: center; padding: 18px 22px 16px; background: rgba(255, 255, 255, 0.95); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 6px 0 var(--ink); max-width: min(600px, calc(100vw - 32px)); }
#gateTap { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 6vw, 30px); letter-spacing: 0.04em; color: var(--ink); text-align: center; }
#gate.ready #gateTap { animation: gateblink 1.6s ease-in-out infinite; }
@keyframes gateblink { 50% { opacity: 0.5; } }
@media (max-height: 560px) { #gate { padding-bottom: calc(10px + var(--safe-b)); } #gate .gbox { gap: 9px; padding: 12px 18px 11px; } }
#loading { font-size: 13px; font-weight: 700; color: var(--ink-2); min-height: 1.2em; }

/* 일시정지 */
#pause { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, 0.78); pointer-events: auto; }
#pause .box { display: grid; gap: 18px; justify-items: center; padding: 26px 24px; background: #fff; border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 6px 0 var(--ink); min-width: min(320px, calc(100vw - 32px)); }
#pause p { margin: 0; font-weight: 700; font-size: 13.5px; color: var(--ink-2); text-align: center; }
#pause .sens { display: grid; gap: 8px; width: 100%; font-weight: 900; font-size: 14px; color: var(--ink); }
#pause .sens span { display: flex; justify-content: space-between; }
#pause input[type=range] { width: 100%; accent-color: var(--ink); height: 28px; }
#pause .inkbtn.small { font-size: 16px; letter-spacing: 0.2em; padding: 11px 18px 10px 24px; background: #fff; color: var(--ink) !important; border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }

/* 조준점 */
#xhair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --s: 7px; }
#xhair i { position: absolute; background: #fff; box-shadow: 0 0 0 1.5px rgba(31, 26, 36, 0.85); border-radius: 1px; transition: opacity .12s; }
#xhair.run i { opacity: 0; }
/* 화면 밖에서 다가오는 사람 방향 */
#threat { position: absolute; inset: 0; overflow: hidden; }
#threat svg { position: absolute; left: 50%; top: 50%; width: var(--tw, 300px); height: var(--tw, 300px); margin-left: calc(var(--tw, 300px) / -2); margin-top: calc(var(--tw, 300px) / -2); opacity: 0; }

#xhair .t, #xhair .b { width: 2px; height: 9px; left: -1px; }
#xhair .l, #xhair .r { width: 9px; height: 2px; top: -1px; }
#xhair .t { bottom: var(--s); }
#xhair .b { top: var(--s); }
#xhair .l { right: var(--s); }
#xhair .r { left: var(--s); }
#xhair .d { width: 3px; height: 3px; left: -1.5px; top: -1.5px; border-radius: 50%; }
#xhair.knife i { background: var(--knife); }
#hitm { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
#hitm i { position: absolute; width: 11px; height: 2.5px; background: #fff; box-shadow: 0 0 0 1px rgba(31, 26, 36, 0.8); border-radius: 1px; }
#hitm i:nth-child(1) { transform: translate(5px, -9px) rotate(-45deg); }
#hitm i:nth-child(2) { transform: translate(-16px, -9px) rotate(45deg); }
#hitm i:nth-child(3) { transform: translate(5px, 7px) rotate(45deg); }
#hitm i:nth-child(4) { transform: translate(-16px, 7px) rotate(-45deg); }
#hitm.kill i { background: var(--blood); box-shadow: 0 0 0 1px #fff; width: 14px; }
#hitm.go { animation: hitm .22s ease-out; }
@keyframes hitm { 0% { opacity: 1; transform: scale(1.35); } 100% { opacity: 0; transform: scale(1); } }

/* 목표 화살표 */
#obj { position: absolute; left: 50%; top: calc(14px + var(--safe-t)); width: 46px; height: 46px; margin-left: -23px; }
#obj svg { width: 46px; height: 46px; display: block; filter: drop-shadow(0 2px 0 rgba(31, 26, 36, 0.35)); }
#obj.in { animation: objin .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes objin { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* 탄약 */
#ammo { position: absolute; right: calc(22px + var(--safe-r)); bottom: calc(18px + var(--safe-b)); display: grid; justify-items: end; gap: 0; color: #fff; text-shadow: 0 2px 0 rgba(31, 26, 36, 0.85), 0 0 6px rgba(31, 26, 36, 0.5); }
#ammo .wn { font-size: 13px; font-weight: 900; letter-spacing: 0.08em; }
#ammo .row { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-display); line-height: 1; }
#ammo b { font-weight: 400; font-size: 46px; font-variant-numeric: tabular-nums; }
#ammo small { font-size: 22px; opacity: 0.92; font-variant-numeric: tabular-nums; }
#ammo.low b { color: #ff5b6a; }
#ammo b.pop { animation: pop .18s ease-out; }
@keyframes pop { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
body.touch #ammo { right: calc(128px + var(--safe-r)); bottom: calc(24px + var(--safe-b)); }

/* 친구 요청 거절 (밖에서 센 것까지) */
#hudK { position: absolute; right: calc(18px + var(--safe-r)); top: calc(10px + var(--safe-t)); display: grid; justify-items: end; color: #fff; text-shadow: 0 2px 0 rgba(31, 26, 36, 0.85), 0 0 6px rgba(31, 26, 36, 0.5); }
#hudK .lbl { font-size: 11.5px; font-weight: 900; letter-spacing: 0.08em; }
#hudK b { font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1.05; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: 100% 70%; }
#hudK b.pop { animation: pop .18s ease-out; }
#prompt { position: absolute; left: 50%; top: calc(50% + 46px); transform: translateX(-50%); font-weight: 900; font-size: 15px; color: #fff; text-shadow: 0 2px 0 rgba(31, 26, 36, 0.85), 0 0 6px rgba(31, 26, 36, 0.6); white-space: nowrap; letter-spacing: 0.04em; }
#lockHint { position: absolute; left: 50%; top: calc(50% - 64px); transform: translateX(-50%); padding: 8px 14px; border: 2px solid var(--ink); border-radius: 6px; background: rgba(255, 255, 255, 0.94); color: var(--ink); font-weight: 900; font-size: 15px; white-space: nowrap; }
#notice { position: absolute; left: 50%; bottom: calc(28% + var(--safe-b)); transform: translateX(-50%); color: var(--ink); font-weight: 900; font-size: 14px; padding: 5px 11px; border: 2px solid var(--ink); border-radius: 5px; background: rgba(255, 255, 255, 0.94); white-space: nowrap; }
#notice.go { animation: notice 1.8s ease-out forwards; }
@keyframes notice { 0% { opacity: 0; transform: translate(-50%, 8px); } 10% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }

/* 붙잡힘 */
#vig { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 50% 50%, rgba(211, 18, 44, 0) 48%, rgba(211, 18, 44, 0.3) 78%, rgba(120, 6, 22, 0.62) 100%); }

/* 말풍선 "싫어." */
#say { position: absolute; left: 50%; bottom: calc(22% + var(--safe-b)); transform: translateX(-50%); padding: 12px 26px 13px; background: #fff; border: 3px solid var(--ink); border-radius: 22px; font-family: var(--font-display); font-size: clamp(34px, 9vw, 58px); line-height: 1; color: var(--ink); box-shadow: 0 5px 0 var(--ink); white-space: nowrap; }
#say::after { content: ""; position: absolute; left: 50%; bottom: -17px; width: 22px; height: 22px; margin-left: -11px; background: #fff; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg) skew(8deg, 8deg); }
#say.go { animation: sayin .32s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes sayin { 0% { transform: translateX(-50%) scale(0.3); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }

#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

/* 결과 */
#result { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--paper); padding: 16px 16px calc(16px + var(--safe-b)); pointer-events: auto; }
#result .lbl { font-weight: 900; font-size: clamp(16px, 4.6vw, 24px); letter-spacing: 0.14em; color: var(--ink); animation: risein .5s .1s cubic-bezier(.2, .8, .25, 1) both; }
#result .num { display: flex; align-items: baseline; justify-content: center; font-family: var(--font-display); line-height: 1; color: var(--ink); margin: 4px 0 30px; animation: risein .5s .18s cubic-bezier(.2, .8, .25, 1) both; }
#result .num b { font-weight: 400; font-size: clamp(86px, 27vw, 170px); font-variant-numeric: tabular-nums; }
#result .num small { font-size: clamp(30px, 8.5vw, 56px); margin-left: 0.1em; }
#result .inkbtn { opacity: 0; visibility: hidden; transition: opacity .35s, transform .08s, box-shadow .08s; font-size: 22px; letter-spacing: 0.3em; padding: 16px 26px 15px 34px; }
#result .inkbtn.show { opacity: 1; visibility: visible; }
@keyframes risein { from { opacity: 0; transform: translateY(18px); } }

/* 터치 조작 */
#stick { position: absolute; left: 0; top: 0; width: 0; height: 0; }
#stick .base { position: absolute; left: -58px; top: -58px; width: 116px; height: 116px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, 0.75); background: rgba(31, 26, 36, 0.18); }
#stick .knob { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); box-shadow: 0 3px 0 rgba(31, 26, 36, 0.35); transition: background .12s; }
#stick.run .knob { background: #ffd23f; }
#stick.run .base { border-color: #ffd23f; }
.tbtn { position: absolute; border-radius: 50%; border: 3px solid var(--ink); background: #fff; display: grid; place-items: center; padding: 0; touch-action: none; transition: background .12s, transform .06s, box-shadow .06s; }
.tbtn svg { grid-area: 1 / 1; }
#fire { right: calc(20px + var(--safe-r)); bottom: calc(26px + var(--safe-b)); width: 96px; height: 96px; box-shadow: 0 5px 0 var(--ink); }
#fire svg { width: 58px; height: 58px; }
#fire .knife { display: none; }
#fire.knife { background: var(--knife); }
#fire.knife .gun { display: none; }
#fire.knife .knife { display: block; }
#fire.down { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
#fire.knife.pulse { animation: kpulse .55s ease-in-out infinite; }
@keyframes kpulse { 50% { box-shadow: 0 5px 0 var(--ink), 0 0 0 14px rgba(211, 18, 44, 0.32); } }
#reload { right: calc(128px + var(--safe-r)); bottom: calc(96px + var(--safe-b)); width: 58px; height: 58px; box-shadow: 0 4px 0 var(--ink); }
#reload svg { width: 30px; height: 30px; }
#reload.down, #swap.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
#swap { right: calc(34px + var(--safe-r)); bottom: calc(136px + var(--safe-b)); width: 66px; height: 66px; box-shadow: 0 4px 0 var(--ink); }
#swap svg { width: 50px; height: 50px; }
#turn { right: calc(196px + var(--safe-r)); bottom: calc(96px + var(--safe-b)); width: 58px; height: 58px; box-shadow: 0 4px 0 var(--ink); }
#turn svg { width: 32px; height: 32px; }
#turn.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
/* 세로 화면: 뒤돌기는 재장전 위로 (왼손 스틱 자리와 안 겹치게) */
@media (orientation: portrait) { #turn { right: calc(128px + var(--safe-r)); bottom: calc(166px + var(--safe-b)); } }
body:not(.touch) #touchUI { display: none; }

.iconbtn { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(255, 255, 255, 0.9); display: grid; place-items: center; padding: 0; }
.iconbtn svg { width: 22px; height: 22px; }
#mute { left: calc(14px + var(--safe-l)); top: calc(12px + var(--safe-t)); z-index: 6; }
#pauseBtn { left: calc(66px + var(--safe-l)); top: calc(12px + var(--safe-t)); z-index: 6; }
#mute .off { display: none; }
#mute.muted .on { display: none; }
#mute.muted .off { display: block; }
#err { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; text-align: center; font-weight: 700; background: var(--paper); pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c" aria-label="게임 화면"></canvas>
<div id="ui">
  <div id="vig"></div>
  <div id="threat" aria-hidden="true"></div>
  <div id="xhair" hidden><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div id="hitm"><i></i><i></i><i></i><i></i></div>
  <div id="obj" hidden aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="rgba(255,255,255,0.88)" stroke="#1f1a24" stroke-width="3"/><g id="objArrow"><path d="M24 7 L36.5 22.5 H29.5 V38 H18.5 V22.5 H11.5 Z" fill="#f6c42f" stroke="#1f1a24" stroke-width="3" stroke-linejoin="round"/></g></svg></div>
  <div id="hudK" hidden><span class="lbl">친구 요청 거절</span><b id="hudN">0</b></div>
  <div id="ammo" hidden><span class="wn" id="ammoName">권총</span><div class="row"><b id="ammoMag">18</b><small id="ammoRes">/ 27</small></div></div>
  <div id="prompt" hidden></div>
  <div id="lockHint" hidden>화면을 클릭하면 마우스로 둘러봅니다</div>
  <div id="notice" hidden role="status" aria-live="polite"></div>
  <div id="say" hidden>싫어.</div>

  <div id="touchUI" hidden>
    <div id="stick" hidden><div class="base"></div><div class="knob"></div></div>
    <button id="fire" class="tbtn" type="button" aria-label="쏘기">
      <svg class="gun" viewBox="0 0 64 64" aria-hidden="true"><path d="M9 22h40l3-3h5v9h-4v4H32l-2 3h-6l-3 13a3 3 0 0 1-3 2.4h-6a2 2 0 0 1-2-2.5l4-14.4L9 30z" fill="#1f1a24"/><path d="M30 35h6l-1.6 6.2a2 2 0 0 1-2 1.5H29" fill="none" stroke="#1f1a24" stroke-width="3" stroke-linejoin="round"/><rect x="12" y="24.5" width="34" height="3" rx="1.5" fill="#fff" opacity=".35"/></svg>
      <svg class="knife" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 40c10-3 26-10 40-24l6-4-2 7C42 33 28 41 14 44z" fill="#fff"/><path d="M14 44l-4 2 4 9 5-2-1.5-7z" fill="#1f1a24" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><path d="M12 41l8-3" stroke="#d3122c" stroke-width="1.6"/></svg>
    </button>
    <button id="reload" class="tbtn" type="button" aria-label="재장전"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" fill="none" stroke="#1f1a24" stroke-width="2.6" stroke-linecap="round"/><path d="M18.8 2.8v4.6h-4.6" fill="none" stroke="#1f1a24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="swap" class="tbtn" type="button" hidden aria-label="무기 바꾸기"><svg viewBox="0 0 64 64" aria-hidden="true" id="swapIcon"></svg></button>
    <button id="turn" class="tbtn" type="button" aria-label="뒤돌기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20.5V10a5 5 0 0 1 10 0v6.5" fill="none" stroke="#1f1a24" stroke-width="2.6" stroke-linecap="round"/><path d="M13.3 13.6l3.7 3.7 3.7-3.7" fill="none" stroke="#1f1a24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <section id="pause" hidden>
    <div class="box">

const lerp = (a, b, t) => a + (b - a) * t;

    A.noise = makeNoise(2.5); A.shaper = makeCurve(2.4); A.shaperHard = makeCurve(4.5);
    const fns = { pistol: () => sfxPistol(0.2), shotgun: () => sfxShotgun(), pump: () => sfxPump(), mag: () => { sfxMagOut(); sfxMagIn(0.4); sfxSlide(0.75); }, flesh: () => sfxFlesh(1), head: () => sfxHead(), stab: () => sfxStab(), grab: () => sfxGrab(), step: () => { sfxStep('carpet'); }, vstep: () => { sfxStep('vinyl'); }, drag: () => sfxDragDemo(1.4), bang: () => sfxDoorBang(0, 1), chair: () => sfxChair(0, 1), lock: () => sfxLock(0.05), creak: () => sfxCreak(0.05, 2.4, 1, 140), sensor: () => sfxSensor(0.05), rattle: () => sfxRattle(), flick: () => sfxFlick(1), breaker: () => sfxBreaker(), getgun: () => sfxGetGun(), ammo: () => sfxAmmo(), wall: () => sfxWallHit(1), heart: () => sfxHeart(1), out: () => sfxOut(), hum: () => { HUM.on = false; humStart(); humSet(1, true); } };
    try { fns[name](); } catch (e) { ac = saveAc; OFFLINE = false; Object.assign(A, saveA); return { err: e.message }; }
    const buf = await off.startRendering();
    ac = saveAc; OFFLINE = false; Object.assign(A, saveA); Object.assign(HUM, saveHum);
    const d = buf.getChannelData(0), d2 = buf.getChannelData(1);
    let peak = 0, sum = 0, nan = 0, last = 0;
    for (let i = 0; i < d.length; i++) { const v = Math.max(Math.abs(d[i]), Math.abs(d2[i])); if (!Number.isFinite(v)) nan++; else { peak = Math.max(peak, v); sum += v * v; if (v > 0.01) last = i; } }
    const step = 32, env = [];
    for (let i = 0; i < d.length; i += step) env.push(Math.round(Math.abs(d[i]) * 1000) / 1000);
    return { peak, rms: Math.sqrt(sum / d.length), nan, tail: last / 44100, env: Array.from(d.filter((_, i) => i % 4 === 0)) };
  },
  clear() { clearCrowd(); PL.clingers.length = 0; PL.pressure = 0; },
  panOf, quickTurn,
  spawn(x, z, kind = 0, state = 'chase') { return newPerson(x, z, { kind, state, yaw: Math.atan2(PL.x - x, PL.z - z) }); },
};
